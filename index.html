<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Briefing</title>
<style>
:root{--bg:#0f1420;--card:#171e2e;--line:#253049;--text:#e7ecf5;--muted:#8b97b0;--accent:#5b8cff;--up:#2fbf71;--down:#ff5d6c}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0}
.sub{color:var(--muted);font-size:13px}
.btns{display:flex;gap:8px}
button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;padding:20px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card.wide{grid-column:1/-1}
.card h2{font-size:13px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.big{font-size:44px;font-weight:600;line-height:1.1}
.err{color:var(--down);font-size:13px}
.muted{color:var(--muted);font-size:13px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.day{background:var(--bg);border-radius:10px;padding:10px;text-align:center;font-size:13px}
.day .ic{font-size:22px}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px}
td.r,th.r{text-align:right}
.up{color:var(--up)} .down{color:var(--down)}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{padding:10px 0;border-bottom:1px solid var(--line)}
ul.list li:last-child{border-bottom:0}
ul.list a{color:var(--text);text-decoration:none}
ul.list a:hover{color:var(--accent)}
.src{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;margin-top:12px}
input{flex:1;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog label{display:block;margin:12px 0 4px;font-size:13px;color:var(--muted)}
dialog input{width:100%}
.x{background:none;border:0;color:var(--muted);padding:0 4px}
@media (max-width:640px){.days{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Daily Briefing</h1>
    <div class="sub" id="date"></div>
    <div class="sub" id="loc">Locating…</div>
  </div>
  <div class="btns">
    <button id="refresh">Refresh</button>
    <button id="settingsBtn">Settings</button>
  </div>
</header>

<main>
  <section class="card wide" id="weather">
    <h2>Weather <span class="muted" id="wStamp"></span></h2>
    <div class="content">Loading…</div>
  </section>

  <section class="card" id="stocks">
    <h2>Stocks</h2>
    <div class="content">Loading…</div>
    <div class="row">
      <input id="symIn" placeholder="Add ticker, e.g. TSLA" maxlength="10">
      <button id="addSym">Add</button>
    </div>
  </section>

  <section class="card" id="deals">
    <h2>Top deals</h2>
    <div class="content">Loading…</div>
  </section>

  <section class="card wide" id="news">
    <h2>Headlines</h2>
    <div class="content">Loading…</div>
  </section>
</main>

<dialog id="dlg">
  <h2 style="font-size:16px;margin:0 0 4px">Settings</h2>
  <label>City (leave blank to use your current location)</label>
  <input id="sCity" placeholder="e.g. Ashburn, VA">
  <label>Finnhub API key (free at finnhub.io, used for stock quotes)</label>
  <input id="sFinn" type="password" autocomplete="off">
  <label>News feed (RSS URL)</label>
  <input id="sNews">
  <label>Deals feed (RSS URL)</label>
  <input id="sDeals">
  <label>rss2json API key (optional)</label>
  <input id="sRss" type="password" autocomplete="off">
  <div class="row" style="justify-content:flex-end">
    <button id="sCancel">Cancel</button>
    <button class="primary" id="sSave">Save</button>
  </div>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

// Replace apiKey and appId with the values from Project settings → Your apps
const firebaseConfig = {
  apiKey: "__FIREBASE_API_KEY__",
  authDomain: "daily-briefing-7939b.firebaseapp.com",
  projectId: "daily-briefing-7939b",
  storageBucket: "daily-briefing-7939b.firebasestorage.app",
  messagingSenderId: "__FIREBASE_SENDER_ID__",
  appId: "__FIREBASE_APP_ID__"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

const KEY = 'dailyBriefing.v1';
const DEFAULTS = {
  city: '',
  finnhubKey: '',
  rssKey: '',
  watchlist: ['AAPL', 'MSFT', 'NVDA', 'SPY'],
  newsFeed: 'https://feeds.bbci.co.uk/news/rss.xml',
  dealsFeed: 'https://slickdeals.net/newsearch.php?mode=frontpage&searcharea=deals&searchin=first&rss=1'
};
// Settings are cached in localStorage and synced to Firestore at users/{uid}/settings/main
let state = { ...DEFAULTS };
let uid = null;
try { state = { ...DEFAULTS, ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch (e) {}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  if (uid) setDoc(doc(db, 'users', uid, 'settings', 'main'), state)
    .catch(e => console.warn('Firestore save failed:', e));
}
async function loadFromCloud(user) {
  uid = user.uid;
  const ref = doc(db, 'users', uid, 'settings', 'main');
  const snap = await getDoc(ref);
  if (snap.exists()) {
    state = { ...DEFAULTS, ...snap.data() };
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  } else {
    await setDoc(ref, state);
  }
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '#';
async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// Open-Meteo weather codes
const WX = {0:['☀️','Clear'],1:['🌤️','Mostly clear'],2:['⛅','Partly cloudy'],3:['☁️','Overcast'],
  45:['🌫️','Fog'],48:['🌫️','Fog'],51:['🌦️','Drizzle'],53:['🌦️','Drizzle'],55:['🌦️','Drizzle'],
  61:['🌧️','Rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],71:['🌨️','Snow'],73:['🌨️','Snow'],
  75:['❄️','Heavy snow'],77:['🌨️','Snow grains'],80:['🌦️','Showers'],81:['🌧️','Showers'],
  82:['⛈️','Violent showers'],95:['⛈️','Thunderstorm'],96:['⛈️','Thunderstorm'],99:['⛈️','Thunderstorm']};
const wx = c => WX[c] || ['❔', 'Unknown'];

$('date').textContent = new Date().toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric', year:'numeric'});

// ---------- Location ----------
let loc = null;
function getGeo() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('Geolocation unavailable'));
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lon: p.coords.longitude }),
      () => rej(new Error('Location permission denied')),
      { timeout: 10000, maximumAge: 600000 });
  });
}
async function resolveLocation() {
  if (state.city.trim()) {
    const g = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(state.city.trim())}&count=1`);
    const r = g.results && g.results[0];
    if (!r) throw new Error(`City not found: ${state.city}`);
    return { name: [r.name, r.admin1, r.country].filter(Boolean).join(', '), lat: r.latitude, lon: r.longitude };
  }
  const p = await getGeo();
  let name = 'Your location';
  try {
    const g = await getJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${p.lat}&longitude=${p.lon}&localityLanguage=en`);
    name = [g.city || g.locality, g.principalSubdivision].filter(Boolean).join(', ') || name;
  } catch (e) {}
  return { name, lat: p.lat, lon: p.lon };
}

// ---------- Weather ----------
async function loadWeather() {
  const box = $('weather').querySelector('.content');
  const u = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}` +
    `&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code` +
    `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max` +
    `&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&forecast_days=5`;
  const d = await getJSON(u);
  const c = d.current;
  const [icon, label] = wx(c.weather_code);
  const days = d.daily.time.map((t, i) => {
    const [di] = wx(d.daily.weather_code[i]);
    const name = new Date(t + 'T12:00').toLocaleDateString(undefined, {weekday:'short'});
    return `<div class="day"><div>${esc(name)}</div><div class="ic">${di}</div>
      <div><b>${Math.round(d.daily.temperature_2m_max[i])}°</b> <span class="muted">${Math.round(d.daily.temperature_2m_min[i])}°</span></div>
      <div class="muted">💧 ${d.daily.precipitation_probability_max[i] ?? 0}%</div></div>`;
  }).join('');
  box.innerHTML = `
    <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
      <div style="font-size:52px">${icon}</div>
      <div>
        <div class="big">${Math.round(c.temperature_2m)}°F</div>
        <div class="muted">${esc(label)} · feels ${Math.round(c.apparent_temperature)}° · humidity ${c.relative_humidity_2m}% · wind ${Math.round(c.wind_speed_10m)} mph</div>
        <div class="muted">${esc(loc.name)}</div>
      </div>
    </div>
    <div class="days">${days}</div>`;
  $('wStamp').textContent = 'updated ' + new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
}

// ---------- Stocks (Finnhub) ----------
async function quote(sym) {
  const r = await getJSON(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(sym)}&token=${encodeURIComponent(state.finnhubKey)}`);
  return { sym, price: r.c, chg: r.d ?? 0, pct: r.dp ?? 0, ok: r.c > 0 };
}
async function loadStocks() {
  const box = $('stocks').querySelector('.content');
  if (!state.finnhubKey) {
    box.innerHTML = '<p class="muted">Add a free Finnhub API key in Settings to see live quotes.</p>';
    return;
  }
  const rows = await Promise.all(state.watchlist.map(s => quote(s).catch(() => ({ sym: s, ok: false }))));
  box.innerHTML = `<table><thead><tr><th>Symbol</th><th class="r">Price</th><th class="r">Change</th><th></th></tr></thead><tbody>
    ${rows.map(r => {
      const rm = `<button class="x" data-rm="${esc(r.sym)}" title="Remove">×</button>`;
      if (!r.ok) return `<tr><td>${esc(r.sym)}</td><td class="r muted" colspan="2">not found</td><td class="r">${rm}</td></tr>`;
      const cls = r.chg >= 0 ? 'up' : 'down', sign = r.chg >= 0 ? '+' : '';
      return `<tr><td><b>${esc(r.sym)}</b></td><td class="r">$${r.price.toFixed(2)}</td>
        <td class="r ${cls}">${sign}${r.chg.toFixed(2)} (${sign}${r.pct.toFixed(2)}%)</td><td class="r">${rm}</td></tr>`;
    }).join('')}
  </tbody></table>`;
}
$('addSym').onclick = addSym;
$('symIn').addEventListener('keydown', e => { if (e.key === 'Enter') addSym(); });
function addSym() {
  const s = $('symIn').value.trim().toUpperCase().replace(/[^A-Z.\-]/g, '');
  $('symIn').value = '';
  if (!s || state.watchlist.includes(s)) return;
  state.watchlist.push(s); save();
  loadStocks().catch(e => { $('stocks').querySelector('.content').innerHTML = `<p class="err">${esc(e.message)}</p>`; });
}
$('stocks').addEventListener('click', e => {
  const b = e.target.closest('[data-rm]');
  if (!b) return;
  state.watchlist = state.watchlist.filter(s => s !== b.dataset.rm); save();
  loadStocks().catch(() => {});
});

// ---------- Feeds: news and deals (RSS via rss2json) ----------
async function feed(url) {
  const key = state.rssKey ? `&api_key=${encodeURIComponent(state.rssKey)}` : '';
  const d = await getJSON(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}${key}`);
  if (d.status !== 'ok') throw new Error(d.message || 'Feed unavailable');
  return d.items || [];
}
async function loadFeed(cardId, url, n) {
  const box = $(cardId).querySelector('.content');
  try {
    const items = await feed(url);
    box.innerHTML = items.length
      ? `<ul class="list">${items.slice(0, n).map(i => `<li>
          <a href="${esc(safeUrl(i.link))}" target="_blank" rel="noopener noreferrer">${esc(i.title)}</a>
          <div class="src">${esc((i.pubDate || '').slice(0, 16))}</div></li>`).join('')}</ul>`
      : '<p class="muted">No items.</p>';
  } catch (e) {
    box.innerHTML = `<p class="err">Couldn't load: ${esc(e.message)}</p>`;
  }
}

// ---------- Orchestration ----------
async function loadAll() {
  $('loc').textContent = 'Locating…';
  try {
    loc = await resolveLocation();
    $('loc').textContent = '📍 ' + loc.name;
    await loadWeather();
  } catch (e) {
    $('loc').textContent = e.message;
    $('weather').querySelector('.content').innerHTML =
      `<p class="err">Weather unavailable: ${esc(e.message)}. Set a city in Settings.</p>`;
  }
  const stocksP = loadStocks().catch(e => {
    $('stocks').querySelector('.content').innerHTML = `<p class="err">${esc(e.message)}</p>`;
  });
  await Promise.all([stocksP, loadFeed('deals', state.dealsFeed, 8), loadFeed('news', state.newsFeed, 8)]);
}

// ---------- Settings ----------
const dlg = $('dlg');
$('settingsBtn').onclick = () => {
  $('sCity').value = state.city;
  $('sFinn').value = state.finnhubKey;
  $('sNews').value = state.newsFeed;
  $('sDeals').value = state.dealsFeed;
  $('sRss').value = state.rssKey;
  dlg.showModal();
};
$('sCancel').onclick = () => dlg.close();
$('sSave').onclick = () => {
  state.city = $('sCity').value.trim();
  state.finnhubKey = $('sFinn').value.trim();
  state.newsFeed = $('sNews').value.trim() || DEFAULTS.newsFeed;
  state.dealsFeed = $('sDeals').value.trim() || DEFAULTS.dealsFeed;
  state.rssKey = $('sRss').value.trim();
  save();
  dlg.close();
  loadAll();
};
try {
  const cred = await signInAnonymously(auth);
  await loadFromCloud(cred.user);
} catch (e) {
  console.warn('Cloud sync unavailable, using local settings:', e);
}
$('refresh').onclick = loadAll;
setInterval(loadAll, 15 * 60 * 1000);
loadAll();
</script>
</body>
</html>
